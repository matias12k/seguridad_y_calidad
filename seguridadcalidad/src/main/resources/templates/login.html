<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Gamer - GamerEvents</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <h1>⚡ GamerEvents</h1>
        <a th:href="@{/eventos}">Volver al Inicio</a>
    </nav>
    <div class="container" style="max-width: 420px; margin-top: 70px;">
        <div class="card" style="padding: 30px;">
            <h2 style="margin-top: 0; color: var(--accent);">Portal Jugadores</h2>
            <p style="font-size: 0.85rem; color: #888;">Credenciales de prueba: <b>gamer_pro</b> / <b>admin123</b></p>
            <input type="text" id="username" placeholder="Usuario" style="margin-bottom: 12px; width: 100%; box-sizing: border-box;">
            <input type="password" id="password" placeholder="Contraseña" style="margin-bottom: 20px; width: 100%; box-sizing: border-box;">
            <button onclick="login()" style="width: 100%; background: var(--accent); color: #000; font-weight: bold; padding: 12px;">Ingresar</button>
            <p id="err" style="color: #ff5555; display: none; margin-top: 15px; text-align: center;"></p>
        </div>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('jwt_username', data.username);
                window.location.href = '/eventos';
            } else {
                const err = document.getElementById('err');
                err.textContent = data.error || 'Credenciales incorrectas';
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
